<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniNav</title>
  </head>
  <body>
    <div id="scene"></div>
    <aside id="panel" class="panel">
      <h1>UniNav</h1>
      <p id="api-status" class="muted">Connecting to the API…</p>

      <form id="login-form" class="stack">
        <label>Username <input name="username" autocomplete="username" required /></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required /></label>
        <button type="submit">Sign in</button>
        <p id="login-error" class="error" hidden></p>
      </form>

      <div id="session" class="stack" hidden>
        <p>Signed in as <strong id="session-user"></strong> <button id="logout" type="button" class="link">Sign out</button></p>
        <label>From <select id="origin"></select></label>
        <label>To <select id="destination"></select></label>
        <label class="inline"><input id="avoid-stairs" type="checkbox" /> Avoid stairs</label>
        <button id="calculate" type="button">Calculate route</button>
        <p id="route-error" class="error" hidden></p>
        <ol id="route-steps" class="steps"></ol>
        <p id="route-summary" class="muted"></p>
      </div>
    </aside>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
